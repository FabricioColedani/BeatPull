<!DOCTYPE html>
<html lang="es" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatPull</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #09090b; 
            color: #f4f4f5; 
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }
        .drag-region { -webkit-app-region: drag; }
        .no-drag { -webkit-app-region: no-drag; }
        .glass-panel { background: rgba(24, 24, 27, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .glow-accent { box-shadow: 0 0 20px rgba(29, 185, 84, 0.2); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    </style>
</head>
<body class="h-full flex flex-col border border-white/10 rounded-xl overflow-hidden">

    <!-- Barra de Título -->
    <header class="drag-region h-12 bg-[#09090b] border-b border-white/5 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center gap-2.5">
            <img src="../../assets/logo.png" class="w-5 h-5 object-contain" alt="Logo">
            <span class="text-xs font-bold tracking-wider text-zinc-300">BEATPULL</span>
        </div>

        <!-- Selector de Pestañas Principales (Básico / Avanzado + Vistas) -->
        <div class="no-drag flex items-center gap-3">
            <div class="flex bg-zinc-900/90 p-1 rounded-full border border-white/5">
                <button id="mode-basic-btn" type="button" class="px-3.5 py-1 text-xs font-semibold rounded-full bg-[#1DB954] text-black transition-all">Básico</button>
                <button id="mode-advanced-btn" type="button" class="px-3.5 py-1 text-xs font-semibold rounded-full text-zinc-400 hover:text-white transition-all">Avanzado</button>
            </div>

            <div class="h-4 w-[1px] bg-white/10"></div>

            <div class="flex bg-zinc-900/90 p-1 rounded-full border border-white/5">
                <button id="nav-main" type="button" class="px-3 py-1 text-xs font-semibold rounded-full text-white bg-zinc-800">Descargar</button>
                <button id="nav-history" type="button" class="px-3 py-1 text-xs font-semibold rounded-full text-zinc-400 hover:text-white">Historial</button>
            </div>

            <!-- En la barra superior, reemplaza el antiguo botón por este icono elegante -->
            <button id="btn-update-ytdlp" type="button" title="Actualizar motor yt-dlp" class="p-2 text-zinc-400 hover:text-white bg-zinc-900/80 hover:bg-zinc-800 rounded-xl border border-white/5 transition-all flex items-center justify-center group">
                <svg id="icon-update-ytdlp" class="w-4 h-4 transition-transform group-hover:rotate-180 duration-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>

            <!-- Añade este contenedor flotante antes de la etiqueta </body> para renderizar las alertas -->
            <div id="toast-container" class="fixed top-14 right-6 z-50 flex flex-col gap-2.5 pointer-events-none max-w-sm w-full"></div>
        </div>

        <div class="no-drag flex items-center gap-1">
            <button id="btn-minimize" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 text-zinc-400"><svg class="w-3.5 h-3.5" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
            <button id="btn-maximize" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 text-zinc-400"><svg class="w-3.5 h-3.5" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg></button>
            <button id="btn-close" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-500/20 text-zinc-400 hover:text-red-400"><svg class="w-3.5 h-3.5" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
        </div>
    </header>

    <!-- VISTA PRINCIPAL -->
    <main id="view-main" class="flex-1 overflow-y-auto p-6 space-y-5">
        
        <!-- Input URL -->
        <div class="relative">
            <input type="text" id="url-input" placeholder="Pega el enlace de YouTube o Playlist aquí..." class="w-full bg-zinc-900/80 text-zinc-100 placeholder-zinc-500 rounded-2xl py-3.5 pl-5 pr-28 text-sm border border-white/10 focus:outline-none focus:border-[#1DB954]">
            <button id="btn-paste" type="button" class="absolute right-2 top-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium py-2 px-3.5 rounded-xl border border-white/5">Pegar</button>
        </div>

        <!-- Previsualización Metadata -->
        <div id="metadata-card" class="hidden glass-panel p-4 rounded-2xl flex items-center gap-4 border border-[#1DB954]/30">
            <img id="meta-thumb" class="w-20 h-20 object-cover rounded-xl bg-zinc-800 shrink-0" src="" alt="Portada">
            <div class="overflow-hidden flex-1">
                <span class="text-[10px] font-bold text-[#1DB954] uppercase tracking-wider">Detectado</span>
                <h4 id="meta-title" class="text-sm font-bold text-white truncate">Cargando título...</h4>
                <p id="meta-uploader" class="text-xs text-zinc-400 truncate">Canal</p>
                <span id="meta-duration" class="inline-block mt-1 text-[11px] font-mono bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-md">0:00</span>
            </div>
        </div>

        <!-- SECCIÓN MODO BÁSICO (Opciones Predefinidas) -->
        <div id="section-basic" class="grid grid-cols-2 gap-3">
            <button type="button" data-preset="1" class="preset-card active text-left p-4 rounded-2xl glass-panel border border-[#1DB954] bg-zinc-800/80 transition-all">
                <div class="flex items-center gap-2.5">
                    <span class="w-3.5 h-3.5 rounded-full border-2 border-[#1DB954] bg-[#1DB954] shrink-0"></span>
                    <span class="text-xs font-bold text-white">1. Estándar</span>
                </div>
                <p class="text-[11px] text-zinc-400 mt-1 pl-6">Video original / Playlist completa</p>
            </button>

            <button type="button" data-preset="2" class="preset-card text-left p-4 rounded-2xl glass-panel border border-white/5 bg-zinc-900/40 hover:bg-zinc-800/50 transition-all">
                <div class="flex items-center gap-2.5">
                    <span class="w-3.5 h-3.5 rounded-full border-2 border-zinc-600 shrink-0"></span>
                    <span class="text-xs font-bold text-white">2. Opus + Metadata</span>
                </div>
                <p class="text-[11px] text-zinc-400 mt-1 pl-6">Audio HQ + Carátula 1:1 integrada</p>
            </button>

            <button type="button" data-preset="3" class="preset-card text-left p-4 rounded-2xl glass-panel border border-white/5 bg-zinc-900/40 hover:bg-zinc-800/50 transition-all">
                <div class="flex items-center gap-2.5">
                    <span class="w-3.5 h-3.5 rounded-full border-2 border-zinc-600 shrink-0"></span>
                    <span class="text-xs font-bold text-white">3. MP3 Enumerado</span>
                </div>
                <p class="text-[11px] text-zinc-400 mt-1 pl-6">Numeración ordenada de pistas</p>
            </button>

            <button type="button" data-preset="4" class="preset-card text-left p-4 rounded-2xl glass-panel border border-white/5 bg-zinc-900/40 hover:bg-zinc-800/50 transition-all">
                <div class="flex items-center gap-2.5">
                    <span class="w-3.5 h-3.5 rounded-full border-2 border-zinc-600 shrink-0"></span>
                    <span class="text-xs font-bold text-white">4. MP3 Max Calidad</span>
                </div>
                <p class="text-[11px] text-zinc-400 mt-1 pl-6">Máxima fidelidad VBR 0</p>
            </button>
        </div>

        <!-- SECCIÓN MODO AVANZADO -->
        <div id="section-advanced" class="hidden glass-panel p-4 rounded-2xl space-y-3">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 mb-1">FORMATO DE AUDIO</label>
                    <select id="adv-format" class="w-full bg-zinc-900 text-zinc-100 rounded-xl p-2.5 border border-white/10 text-xs focus:outline-none">
                        <option value="mp3">mp3</option>
                        <option value="flac">flac</option>
                        <option value="opus">opus</option>
                        <option value="m4a">m4a</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 mb-1">CALIDAD</label>
                    <select id="adv-quality" class="w-full bg-zinc-900 text-zinc-100 rounded-xl p-2.5 border border-white/10 text-xs focus:outline-none">
                        <option value="320k">320k (Máxima)</option>
                        <option value="256k">256k</option>
                        <option value="128k">128k</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center gap-5 pt-1">
                <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer"><input type="checkbox" id="adv-thumb" class="accent-[#1DB954]" checked> Integrar Carátula</label>
                <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer"><input type="checkbox" id="adv-metadata" class="accent-[#1DB954]" checked> Integrar Metadatos</label>
            </div>
        </div>

        <!-- Carpeta -->
        <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between">
            <div class="overflow-hidden mr-4">
                <span class="text-[10px] font-semibold text-zinc-400 uppercase">Ubicación de guardado</span>
                <span id="folder-path-display" class="text-xs font-mono text-zinc-300 truncate block">Por defecto (Carpeta Descargas)</span>
            </div>
            <button id="btn-select-folder" class="bg-zinc-800 hover:bg-zinc-700 text-xs py-2 px-3.5 rounded-xl border border-white/5">Cambiar</button>
        </div>

        <!-- Botones Acción -->
        <div class="flex gap-3">
            <button id="btn-add-queue" type="button" class="w-1/3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3.5 rounded-2xl border border-white/10 text-xs">
                + Añadir a Cola
            </button>
            <button id="btn-download" type="button" class="w-2/3 bg-[#1DB954] hover:bg-[#1ed760] text-black font-extrabold text-sm py-3.5 rounded-2xl glow-accent">
                DESCARGAR AHORA
            </button>
        </div>

        <!-- Cola de Espera -->
        <div id="queue-container" class="hidden glass-panel p-4 rounded-2xl space-y-2">
            <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Cola de Espera (<span id="queue-count">0</span>)</h4>
            <div id="queue-list" class="space-y-2 max-h-36 overflow-y-auto"></div>
        </div>

        <!-- Progreso -->
        <div id="progress-container" class="hidden space-y-2">
            <div class="flex justify-between text-xs">
                <span id="progress-status" class="font-semibold text-[#1DB954]">Procesando...</span>
                <span id="progress-text" class="font-mono text-zinc-400">0%</span>
            </div>
            <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-[#1DB954] h-full w-0 transition-all"></div>
            </div>
        </div>

        <!-- Consola Log -->
        <details class="glass-panel rounded-2xl overflow-hidden group">
            <summary class="p-4 cursor-pointer text-xs font-semibold text-zinc-400 hover:text-zinc-200 select-none flex justify-between items-center list-none [&::-webkit-details-marker]:hidden">
                <div class="flex items-center gap-2">
                    <!-- Flecha indicadora animada -->
                    <svg class="w-3.5 h-3.5 text-zinc-500 group-open:rotate-90 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                    <span>Consola en Tiempo Real</span>
                </div>
                
                <!-- Badge Terminal Estilizado -->
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-zinc-900/90 border border-white/10 text-[10px] font-mono font-medium text-zinc-300 tracking-wider">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#1DB954] animate-pulse"></span>
                    <span>STDOUT</span>
                </div>
            </summary>
            <div class="p-4 pt-0">
                <textarea id="console-log" class="w-full h-32 bg-black/60 text-zinc-300 font-mono text-[11px] p-3 rounded-xl border border-white/5 resize-none focus:outline-none" readonly></textarea>
            </div>
        </details>
    </main>

    <!-- VISTA HISTORIAL -->
    <main id="view-history" class="hidden flex-1 overflow-y-auto p-6 space-y-4">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-base font-bold text-white">Historial de Descargas</h2>
            <button id="btn-clear-history" class="text-xs text-red-400 hover:underline">Limpiar Historial</button>
        </div>
        <div id="history-list" class="space-y-3"></div>
    </main>

    <!-- Toast de Portapapeles Detector -->
    <div id="clipboard-toast" class="hidden fixed bottom-6 right-6 glass-panel border border-[#1DB954]/50 p-3.5 rounded-2xl flex items-center gap-3 shadow-2xl z-40 animate-bounce">
        <span class="text-xs text-zinc-200">📋 Enlace detectado</span>
        <button id="btn-toast-add" class="bg-[#1DB954] text-black font-bold text-xs py-1.5 px-3 rounded-xl">Pegar</button>
        <button id="btn-toast-close" class="text-zinc-400 hover:text-white text-xs px-1">✕</button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
