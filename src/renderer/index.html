<!DOCTYPE html>
<html lang="es" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatPull</title>
    <!-- Tipografía de Alta Calidad -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tipografía y Renderizado de Alta Fidelidad */
        body { 
            background-color: #09090b; 
            color: #f4f4f5; 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .drag-region { -webkit-app-region: drag; }
        .no-drag { -webkit-app-region: no-drag; }
        
        .glass-panel { 
            background: rgba(24, 24, 27, 0.65); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.07); 
        }

        .glow-accent { 
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.2); 
        }

        /* Personalización de Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="h-full flex flex-col rounded-xl overflow-hidden border border-white/10">

    <!-- Barra de Título Corregida (Drag Region) -->
    <header class="drag-region h-12 bg-[#09090b] border-b border-white/5 flex items-center justify-between px-4 shrink-0">
        <!-- Logo + Nombre de la App -->
        <div class="flex items-center gap-2.5">
            <img src="../../assets/logo.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'%231DB954\' viewBox=\'0 0 24 24\'><path d=\'M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\'/></svg>'" class="w-5 h-5 object-contain" alt="Logo">
            <span class="text-xs font-bold tracking-wider text-zinc-300">BEATPULL</span>
        </div>

        <!-- Pestañas de Modo (Básico / Avanzado) -->
        <div class="no-drag flex bg-zinc-900/90 p-1 rounded-full border border-white/5">
            <button id="tab-basic" type="button" class="px-4 py-1.5 text-xs font-semibold rounded-full text-zinc-400 hover:text-white transition-all">Básico</button>
            <button id="tab-advanced" type="button" class="px-4 py-1.5 text-xs font-semibold rounded-full bg-[#1DB954] text-black transition-all">Avanzado</button>
        </div>

        <!-- Botones de Control de Ventana (Corregidos con SVG) -->
        <div class="no-drag flex items-center gap-1">
            <button id="btn-minimize" type="button" title="Minimizar" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 text-zinc-400 hover:text-white transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="6" x2="11" y2="6"/></svg>
            </button>
            <button id="btn-maximize" type="button" title="Maximizar" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 text-zinc-400 hover:text-white transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg>
            </button>
            <button id="btn-close" type="button" title="Cerrar" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-500/20 text-zinc-400 hover:text-red-400 transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l8 8M10 2l-8 8"/></svg>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 overflow-y-auto p-6 space-y-5">

        <!-- Input de URL -->
        <div class="relative">
            <input type="text" id="url-input" placeholder="Pega el enlace de YouTube o Playlist aquí..." class="w-full bg-zinc-900/80 text-zinc-100 placeholder-zinc-500 rounded-2xl py-3.5 pl-5 pr-24 text-sm border border-white/10 focus:outline-none focus:border-[#1DB954] focus:ring-1 focus:ring-[#1DB954] transition-all">
            <button id="btn-paste" type="button" class="absolute right-2 top-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium py-2 px-3.5 rounded-xl transition-all border border-white/5">
                Pegar
            </button>
        </div>

        <!-- MODO BÁSICO -->
        <div id="panel-basic" class="hidden grid grid-cols-2 gap-3">
            <label class="glass-panel p-4 rounded-2xl cursor-pointer hover:border-[#1DB954]/50 transition-all flex items-center gap-3.5 group">
                <input type="radio" name="flow" value="1" class="accent-[#1DB954] w-4 h-4" checked>
                <div>
                    <h3 class="font-semibold text-sm group-hover:text-[#1DB954] transition-colors">1. Estándar</h3>
                    <p class="text-xs text-zinc-400">Video original / Playlist completa</p>
                </div>
            </label>
            <label class="glass-panel p-4 rounded-2xl cursor-pointer hover:border-[#1DB954]/50 transition-all flex items-center gap-3.5 group">
                <input type="radio" name="flow" value="2" class="accent-[#1DB954] w-4 h-4">
                <div>
                    <h3 class="font-semibold text-sm group-hover:text-[#1DB954] transition-colors">2. Opus + Metadata</h3>
                    <p class="text-xs text-zinc-400">Audio HQ + Carátula 1:1 integrada</p>
                </div>
            </label>
            <label class="glass-panel p-4 rounded-2xl cursor-pointer hover:border-[#1DB954]/50 transition-all flex items-center gap-3.5 group">
                <input type="radio" name="flow" value="3" class="accent-[#1DB954] w-4 h-4">
                <div>
                    <h3 class="font-semibold text-sm group-hover:text-[#1DB954] transition-colors">3. MP3 Enumerado</h3>
                    <p class="text-xs text-zinc-400">Numeración ordenada de pistas</p>
                </div>
            </label>
            <label class="glass-panel p-4 rounded-2xl cursor-pointer hover:border-[#1DB954]/50 transition-all flex items-center gap-3.5 group">
                <input type="radio" name="flow" value="4" class="accent-[#1DB954] w-4 h-4">
                <div>
                    <h3 class="font-semibold text-sm group-hover:text-[#1DB954] transition-colors">4. MP3 Max Calidad</h3>
                    <p class="text-xs text-zinc-400">Máxima fidelidad VBR 0</p>
                </div>
            </label>
        </div>

        <!-- MODO AVANZADO -->
        <div id="panel-advanced" class="glass-panel p-5 rounded-2xl space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 tracking-wider mb-1.5 uppercase">FORMATO</label>
                    <select id="adv-format" class="w-full bg-zinc-900 text-zinc-100 rounded-xl p-3 border border-white/10 focus:outline-none focus:border-[#1DB954] text-xs font-medium">
                        <option value="mp3">mp3</option>
                        <option value="flac">flac</option>
                        <option value="m4a">m4a</option>
                        <option value="wav">wav</option>
                        <option value="opus">opus</option>
                        <option value="aac">aac</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 tracking-wider mb-1.5 uppercase">CALIDAD</label>
                    <select id="adv-quality" class="w-full bg-zinc-900 text-zinc-100 rounded-xl p-3 border border-white/10 focus:outline-none focus:border-[#1DB954] text-xs font-medium">
                        <option value="320k">320k</option>
                        <option value="256k">256k</option>
                        <option value="192k">192k</option>
                        <option value="128k">128k</option>
                        <option value="0">0 (Mejor VBR)</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center gap-6 pt-1">
                <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-zinc-300">
                    <input type="checkbox" id="adv-thumb" class="accent-[#1DB954] w-4 h-4 rounded" checked>
                    Incrustar Portada
                </label>
                <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-zinc-300">
                    <input type="checkbox" id="adv-metadata" class="accent-[#1DB954] w-4 h-4 rounded" checked>
                    Incrustar Metadatos
                </label>
                <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-zinc-300">
                    <input type="checkbox" id="adv-is-playlist" class="accent-[#1DB954] w-4 h-4 rounded">
                    Es Playlist / Álbum
                </label>
            </div>

            <div id="adv-range-container" class="hidden pt-1">
                <label class="block text-[11px] font-semibold text-zinc-400 tracking-wider mb-1 uppercase">Rango Playlist (Ej. 1-10, 1,3,5)</label>
                <input type="text" id="adv-range" placeholder="all" class="w-full bg-zinc-900 text-zinc-100 rounded-xl p-3 border border-white/10 focus:outline-none focus:border-[#1DB954] text-xs">
            </div>
        </div>

        <!-- Selector de Carpeta -->
        <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
            <div class="overflow-hidden mr-4">
                <span class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider block">Ubicación de guardado</span>
                <span id="folder-path-display" class="text-xs font-mono text-zinc-300 truncate block mt-0.5">
                    Por defecto (Carpeta Descargas)
                </span>
            </div>
            <button id="btn-select-folder" type="button" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium py-2.5 px-4 rounded-xl border border-white/5 transition-all shrink-0">
                Cambiar
            </button>
        </div>

        <!-- Botón Descargar -->
        <button id="btn-download" type="button" class="w-full bg-[#1DB954] hover:bg-[#1ed760] text-black font-bold text-sm tracking-wide py-3.5 px-8 rounded-2xl transition-all transform hover:scale-[1.005] active:scale-[0.995] glow-accent">
            DESCARGAR AHORA
        </button>

        <!-- Progreso Dinámico -->
        <div id="progress-container" class="hidden space-y-2">
            <div class="flex justify-between text-xs">
                <span class="font-semibold text-[#1DB954]">Procesando...</span>
                <span id="progress-text" class="font-mono text-zinc-400">0%</span>
            </div>
            <div class="w-full bg-zinc-800/80 rounded-full h-2 overflow-hidden border border-white/5">
                <div id="progress-bar" class="bg-[#1DB954] h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Consola Log -->
        <details class="glass-panel rounded-2xl overflow-hidden group">
            <summary class="p-4 cursor-pointer text-xs font-semibold text-zinc-400 hover:text-zinc-200 select-none flex justify-between items-center list-none [&::-webkit-details-marker]:hidden">
                <div class="flex items-center gap-2">
                    <!-- Flecha indicadora animada -->
                    <svg class="w-3.5 h-3.5 text-zinc-500 group-open:rotate-90 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                    <span>Consola en Tiempo Real</span>
                </div>
                
                <!-- Badge Terminal Estilizado -->
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-zinc-900/90 border border-white/10 text-[10px] font-mono font-medium text-zinc-300 tracking-wider">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#1DB954] animate-pulse"></span>
                    <span>STDOUT</span>
                </div>
            </summary>
            <div class="p-4 pt-0">
                <textarea id="console-log" class="w-full h-32 bg-black/60 text-zinc-300 font-mono text-[11px] p-3 rounded-xl border border-white/5 resize-none focus:outline-none" readonly></textarea>
            </div>
        </details>
    </main>

    <!-- Modal Dependencias -->
    <div id="dependency-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-50 p-4">
        <div class="glass-panel p-6 rounded-2xl text-center max-w-sm w-full border border-red-500/30">
            <h2 class="text-base font-bold mb-2 text-red-400">yt-dlp no encontrado</h2>
            <p class="mb-4 text-xs text-zinc-300">Abre tu terminal de Windows y ejecuta:</p>
            <code class="block bg-black p-3 rounded-xl mb-4 font-mono text-xs text-green-400 border border-white/10">winget install yt-dlp</code>
            <button id="btn-recheck" type="button" class="w-full bg-[#1DB954] text-black font-semibold py-2.5 px-4 rounded-xl text-xs">Recomprobar</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
